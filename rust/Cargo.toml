[workspace]
members = [
  "crates/xiaoyu-protocol",
  "crates/xiaoyu-core",
]
resolver = "2"

[workspace.package]
version = "0.2.19"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
