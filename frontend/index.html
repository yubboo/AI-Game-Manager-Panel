<!doctype html>
<html lang="zh-CN" class="agmp-preload">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#151310" />
    <script>
      // PREPAINT_THEME_RESTORE：在 Vue/CSS 下载和执行前恢复上次主题，杜绝浏览器默认白底闪屏。
      (() => {
        try {
          const choice = localStorage.getItem('agmp.ui.theme-choice') || 'dark'
          const resolved = choice === 'system'
            ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
            : (choice === 'light' ? 'light' : 'dark')
          const root = document.documentElement
          root.dataset.themeChoice = choice
          root.dataset.theme = resolved
          root.style.colorScheme = resolved
        } catch {
          document.documentElement.dataset.theme = 'dark'
          document.documentElement.style.colorScheme = 'dark'
        }
      })()
    </script>
    <style>
      html,body,#app{width:100%;height:100%;margin:0;background:#0e0d0c}
      html[data-theme="light"],html[data-theme="light"] body,html[data-theme="light"] #app{background:#f3efe8}
      html.agmp-preload *,html.agmp-preload *::before,html.agmp-preload *::after{animation:none!important;transition:none!important}
    </style>
    <title>AI游戏管理器面板</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
