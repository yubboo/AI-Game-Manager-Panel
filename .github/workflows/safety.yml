name: AI Game Manager Panel 0.4 Safety Gate
on:
  push:
  pull_request:

jobs:
  core-ts:
    name: TypeScript Agent + UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm run test:core
      - run: npm run gate
      - name: Build frozen Vue UI
        working-directory: frontend
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          corepack pnpm build
      - name: Typecheck Electron desktop shell
        working-directory: desktop/electron
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          corepack pnpm typecheck

  rust-linux:
    name: Linux Rust Native + Managed Java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path crates/Cargo.toml --workspace
      - run: cargo build --manifest-path crates/Cargo.toml --release --bin agmp-native
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/ci/managed-java-smoke.mjs crates/target/release/agmp-native 21

  rust-windows:
    name: Windows Rust Native + Managed Java
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path crates/Cargo.toml --workspace
      - run: cargo build --manifest-path crates/Cargo.toml --release --bin agmp-native
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/ci/managed-java-smoke.mjs crates/target/release/agmp-native.exe 21

  source-safety:
    name: No-Go + Naming + GitHub Safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/gates/check-no-go.mjs
      - run: node scripts/common/check-naming.mjs
      - run: node scripts/common/check-github-safety.mjs
      - name: Ignored build cache must not trip GitHub Safety
        shell: bash
        run: |
          mkdir -p build/work/rust-target/debug/incremental
          printf 'sk-%s\0binary' 'ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890' > build/work/rust-target/debug/incremental/ignored.o
          node scripts/common/check-github-safety.mjs
          rm -rf build/work
