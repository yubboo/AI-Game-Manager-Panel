name: AI Game Manager Panel Safety Gate

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Source tree integrity guard
        run: |
          test -f scripts/common/check-github-safety.mjs
          test -f scripts/common/check-project-layout.mjs
          test -f scripts/common/check-xiaoyu-harness.mjs
          test -f rust/Cargo.toml
          test -f rust/Cargo.lock
          test -f rust/crates/xiaoyu-core/src/lib.rs
          test -f rust/crates/xiaoyu-core/src/tool_search.rs
          test -f rust/crates/xiaoyu-core/src/session.rs
          test -f rust/crates/xiaoyu-core/src/jobs.rs
          test -f rust/crates/xiaoyu-core/src/terminal.rs
          test -f rust/crates/xiaoyu-core/src/pty_linux.rs
          test -f rust/crates/xiaoyu-core/src/pty_windows.rs
          test -f frontend/pnpm-lock.yaml
          test -f desktop/electron/pnpm-lock.yaml
          test -f docs/architecture/LANGUAGE-OWNERSHIP.md
          test -f runtime/README.md
          test -f internal/xiaoyu/host/loop.go
          test -f frontend/src/app/router.ts

      - name: Source tree gate
        run: node scripts/common/check-source-tree.mjs

      - name: Naming and path gate
        run: node scripts/common/check-naming.mjs

      - name: Language ownership gate
        run: node scripts/common/check-language-ownership.mjs

      - name: Dependency lock gate
        run: node scripts/common/check-dependency-locks.mjs

      - name: Duplicate source gate
        run: node scripts/common/check-duplicates.mjs

      - name: GitHub secret/file safety gate
        run: node scripts/common/check-github-safety.mjs

      - name: Project structure gate
        run: node scripts/common/check-project-layout.mjs

      - name: Product architecture gate
        run: node scripts/common/check-product-architecture.mjs

      - name: Module ownership gate
        run: node scripts/common/check-modules.mjs

      - name: Windows updater gate
        run: node scripts/common/check-updater.mjs

      - name: Windows installer gate
        run: node scripts/common/check-windows-installer.mjs

      - name: XiaoYu Rust Agent Runtime structure gate
        run: node scripts/common/check-xiaoyu-core.mjs

      - name: XiaoYu autonomous harness gate
        run: node scripts/common/check-xiaoyu-harness.mjs

      - name: XiaoYu model center gate
        run: node scripts/common/check-xiaoyu-model-center.mjs

      - name: XiaoYu intelligence gate
        run: node scripts/common/check-xiaoyu-intelligence.mjs

      - name: XiaoYu Agent Runtime gate
        run: node scripts/common/check-xiaoyu-agent-runtime.mjs

      - name: XiaoYu Agent Bench gate
        run: node scripts/common/check-xiaoyu-agent-bench.mjs

      - name: XiaoYu Session and Job Runtime gate
        run: node scripts/common/check-xiaoyu-jobs.mjs

      - name: XiaoYu Persistent Runtime Worker gate
        run: node scripts/common/check-xiaoyu-worker.mjs

      - name: XiaoYu Terminal Session gate
        run: node scripts/common/check-xiaoyu-terminal.mjs

      - name: Multi-client AI parity gate
        run: node scripts/common/check-multi-client-ai.mjs

      - name: Organization and email security gate
        run: node scripts/common/check-organization-security.mjs

      - name: Bridge authentication boundary gate
        run: node scripts/common/check-bridge-auth-boundary.mjs

      - name: Web session security gate
        run: node scripts/common/check-web-session-security.mjs

      - name: Environment Manager v2 gate
        run: node scripts/common/check-environment-manager.mjs

      - name: Linux headless XiaoYu gate
        run: node scripts/common/check-headless-xiaoyu.mjs

      - name: Release key structure gate
        run: node scripts/common/check-release-key.mjs --allow-unconfigured

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Verify locked Go modules
        run: |
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Go tests
        run: go test ./internal/... ./cmd/...

      - name: Go vet
        run: go vet ./internal/... ./cmd/...

      - name: XiaoYu Agent Bench
        run: go test ./internal/xiaoyu/host -run '^TestAgentBench' -count=1 -v

      - name: Development license build-tag test
        run: go test -tags agmp_dev_license ./internal/system/license

      - name: Rust Agent format
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check

      - name: Rust Agent check
        run: cargo check --manifest-path rust/Cargo.toml --workspace --locked

      - name: XiaoYu Linux native PTY integration
        run: cargo test --manifest-path rust/Cargo.toml -p xiaoyu-core --locked linux_terminal_ -- --nocapture

      - name: Rust Agent tests
        run: cargo test --manifest-path rust/Cargo.toml --workspace --locked


  headless-ai:
    name: Linux Headless + Web + XiaoYu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Source tree integrity guard
        run: |
          test -f scripts/common/check-github-safety.mjs
          test -f scripts/common/check-project-layout.mjs
          test -f scripts/common/check-xiaoyu-harness.mjs
          test -f rust/Cargo.toml
          test -f rust/Cargo.lock
          test -f rust/crates/xiaoyu-core/src/lib.rs
          test -f rust/crates/xiaoyu-core/src/tool_search.rs
          test -f rust/crates/xiaoyu-core/src/session.rs
          test -f rust/crates/xiaoyu-core/src/jobs.rs
          test -f rust/crates/xiaoyu-core/src/terminal.rs
          test -f rust/crates/xiaoyu-core/src/pty_linux.rs
          test -f rust/crates/xiaoyu-core/src/pty_windows.rs
          test -f frontend/pnpm-lock.yaml
          test -f desktop/electron/pnpm-lock.yaml
          test -f docs/architecture/LANGUAGE-OWNERSHIP.md
          test -f runtime/README.md
          test -f internal/xiaoyu/host/loop.go
          test -f frontend/src/app/router.ts

      - name: Source tree and naming gates
        run: |
          node scripts/common/check-source-tree.mjs
          node scripts/common/check-naming.mjs
          node scripts/common/check-language-ownership.mjs
          node scripts/common/check-dependency-locks.mjs
          node scripts/common/check-duplicates.mjs
          node scripts/common/check-xiaoyu-agent-bench.mjs

      - name: Enforce headless AI parity
        run: |
          node scripts/common/check-xiaoyu-harness.mjs
          node scripts/common/check-xiaoyu-model-center.mjs
          node scripts/common/check-xiaoyu-intelligence.mjs
          node scripts/common/check-xiaoyu-agent-runtime.mjs
          node scripts/common/check-xiaoyu-agent-bench.mjs
          node scripts/common/check-xiaoyu-jobs.mjs
          node scripts/common/check-xiaoyu-worker.mjs
          node scripts/common/check-xiaoyu-terminal.mjs
          node scripts/common/check-multi-client-ai.mjs
          node scripts/common/check-headless-xiaoyu.mjs
          node scripts/common/check-organization-security.mjs
          node scripts/common/check-bridge-auth-boundary.mjs
          node scripts/common/check-web-session-security.mjs

      - name: Build XiaoYu headless runtime
        run: cargo build --manifest-path rust/Cargo.toml -p xiaoyu-core --release --locked

      - name: Install and build Web UI
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Verify Electron dependency lock
        working-directory: desktop/electron
        run: pnpm install --frozen-lockfile --lockfile-only

      - name: Sync Web assets
        run: node scripts/common/sync-web-assets.mjs

      - name: Verify locked Go modules
        run: |
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build Linux headless AGMP Core
        run: go build -tags agmp_dev_license -trimpath -o /tmp/agmp-headless ./cmd/aigame-manager-web

      - name: Verify Web can reach XiaoYu without a desktop shell
        env:
          AGMP_HEADLESS_XIAOYU_RUNTIME: ${{ github.workspace }}/rust/target/release/xiaoyu
        run: go test -tags agmp_dev_license ./internal/bridge/httpapi -run TestLinuxHeadlessWebCanReachPrecompiledXiaoYuRuntime -count=1

      - name: Verify headless artifacts
        run: |
          test -x rust/target/release/xiaoyu
          test -x /tmp/agmp-headless
          test -f cmd/aigame-manager-web/web/index.html


  windows-rust-runtime:
    name: Windows Rust Runtime + ConPTY
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: XiaoYu Terminal/PTY structure gate
        run: node scripts/common/check-xiaoyu-terminal.mjs

      - name: Rust Agent format
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check

      - name: Rust Agent check on Windows
        run: cargo check --manifest-path rust/Cargo.toml --workspace --locked

      - name: XiaoYu Windows ConPTY integration
        run: cargo test --manifest-path rust/Cargo.toml -p xiaoyu-core --locked windows_terminal_ -- --nocapture

      - name: Rust Agent tests on Windows
        run: cargo test --manifest-path rust/Cargo.toml --workspace --locked


  windows-helper:
    name: Windows Helper + Encoding
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "PowerShell parse failure: $($_.FullName)" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
            }
          }
          if ($failed) { exit 1 }

      - name: Windows helper structure test
        shell: powershell
        run: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/windows/Test-WindowsHelper.ps1

      - name: Windows helper Node gate
        run: node scripts/common/check-windows-helper.mjs

      - name: Source tree and naming gates
        run: |
          node scripts/common/check-source-tree.mjs
          node scripts/common/check-naming.mjs
          node scripts/common/check-language-ownership.mjs
          node scripts/common/check-dependency-locks.mjs
          node scripts/common/check-duplicates.mjs
          node scripts/common/check-xiaoyu-agent-bench.mjs
