services:
  ai-game-manager-panel:
    build:
      context: ../..
      dockerfile: distribution/docker/Dockerfile
    image: ai-game-manager-panel/ai-game-manager-panel-server:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:17890:17890"
    volumes:
      - ai-game-manager-panel-data:/var/lib/ai-game-manager-panel
volumes:
  ai-game-manager-panel-data:
