appId: com.aigamemanager.panel
productName: AI游戏管理器面板

electronDist: node_modules/electron/dist
npmRebuild: false
asar: true
compression: maximum
electronLanguages:
  - zh-CN
  - en-US

files:
  - dist/**
  - package.json

extraResources:
  - from: ../../dist
    to: core
  - from: ../../frontend/dist
    to: core/frontend/dist
  - from: ../../configs
    to: core/configs
  - from: ../../skills
    to: core/skills
  - from: ../../crates/target/release/agmp-native.exe
    to: native/agmp-native.exe

# Build products stay under the ignored root build/ tree.
directories:
  output: ../../build/work/electron-builder
  buildResources: ../../build

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  artifactName: AI-Game-Manager-Panel-${version}-x64-Setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AI游戏管理器面板
  uninstallDisplayName: AI游戏管理器面板

portable:
  artifactName: AI-Game-Manager-Panel-${version}-x64-Portable.${ext}
